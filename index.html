<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Codex GitHub OpenAI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 20% 15%, #173d35 0, transparent 55%),
          radial-gradient(ellipse at 85% 90%, #25234b 0, transparent 55%),
          #0c1117;
        color: #f3f6fa;
      }

      main {
        width: min(100%, 900px);
        padding: clamp(32px, 8vw, 80px) clamp(24px, 6vw, 64px);
        border: 1px solid #ffffff1f;
        border-radius: 28px;
        background: #111820cc;
        box-shadow: 0 24px 80px #00000040;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Test Codex GitHub OpenAI</h1>
    </main>
  </body>
</html>
